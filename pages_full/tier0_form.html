<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reserve a stay</title>
<!-- Tier 0 static control: fictional guesthouse booking form. No motion of any kind. -->
<style>
  html, body { width:1280px; height:800px; overflow:hidden; margin:0; }
  * { caret-color: transparent; box-sizing: border-box; animation: none !important; transition: none !important; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  button { font: inherit; cursor: pointer; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); }

  /* brand + nav */
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 30px; height: 30px; flex: none; }
  .brand b { font-size: 17px; letter-spacing: .02em; display: block; }
  .brand small { font-size: 11px; color: var(--muted); display: block; }
  .nav a { color: var(--ink); font-size: 14px; }
  .nav a.signin { color: var(--accent); font-weight: 600; }

  /* fields */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .field .box { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 10px; border-radius: 6px; min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .field .box .val { font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .icon { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
  .icon svg { width: 14px; height: 14px; pointer-events: none; }
  .btn { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 6px 12px; }
  .btn.solid { background: var(--accent); color: #fff; font-weight: 600; }
  .btn.wide { width: 100%; padding: 12px; font-size: 15px; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: 13px; }

  /* photos */
  .photo { border-radius: 8px; position: relative; overflow: hidden; }
  .photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* rooms */
  .room { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); display: flex; gap: 12px; align-items: center; }
  .room .sw { width: 44px; height: 44px; border-radius: 6px; flex: none; }
  .room .info { flex: 1; min-width: 0; }
  .room .info b { display: block; }
  .room .info span { font-size: 12px; color: var(--muted); }
  .room .price { font-weight: 600; white-space: nowrap; }
  .room.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }

  /* summary */
  .sum-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .sum-row.total { border-bottom: 0; font-size: 16px; font-weight: 700; padding-top: 8px; }
  .status { font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .foot a { color: var(--muted); font-size: 12px; }

  /* ===== v0: top bar, details left, summary card right ===== */
  .v0 header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .v0 header .nav { display: flex; gap: 26px; align-items: center; }
  .v0 main { display: grid; grid-template-columns: 1fr 360px; gap: 28px; padding: 18px 40px; }
  .v0 .left { display: flex; flex-direction: column; gap: 12px; }
  .v0 .titlebar { display: flex; justify-content: space-between; align-items: flex-start; }
  .v0 .titlebar h1 { font-size: 26px; }
  .v0 .titlebar .acts { display: flex; gap: 6px; }
  .v0 .gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; height: 170px; }
  .v0 .rooms { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .v0 .rooms .room { flex-direction: column; align-items: stretch; gap: 6px; }
  .v0 .rooms .room .sw { width: 100%; height: 26px; }
  .v0 .fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .v0 aside { border-radius: 12px; padding: 20px; align-self: start; display: flex; flex-direction: column; gap: 10px; }
  .v0 .foot { position: absolute; left: 40px; bottom: 14px; display: flex; gap: 18px; }

  /* ===== v1: dark-ish sidebar nav on the left, stepped single column, summary strip at bottom ===== */
  .v1 { display: flex; height: 800px; }
  .v1 .side { width: 220px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 26px 20px; display: flex; flex-direction: column; gap: 24px; }
  .v1 .side .nav { display: flex; flex-direction: column; gap: 14px; }
  .v1 .side .nav a { padding: 4px 0; }
  .v1 .side .foot { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .v1 .content { flex: 1; padding: 26px 44px; display: flex; flex-direction: column; gap: 14px; }
  .v1 .head { display: flex; align-items: center; gap: 18px; }
  .v1 .head .photo { width: 120px; height: 80px; flex: none; }
  .v1 .head h1 { font-size: 24px; }
  .v1 .head .acts { margin-left: auto; display: flex; gap: 8px; }
  .v1 .step { border-radius: 10px; padding: 14px 18px; }
  .v1 .step h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .v1 .step h3 i { font-style: normal; color: var(--accent); margin-right: 6px; }
  .v1 .rooms { display: flex; flex-direction: column; gap: 8px; }
  .v1 .fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .v1 .strip { margin-top: auto; border-radius: 10px; padding: 14px 18px; display: grid; grid-template-columns: 1fr 1fr 1fr 260px; gap: 22px; align-items: center; }
  .v1 .strip .sum-row { border: 0; flex-direction: column; padding: 0; }

  /* ===== v2: no sidebar, centered narrow column, dense ===== */
  .v2 header { height: 52px; display: flex; align-items: center; justify-content: center; gap: 60px; border-bottom: 2px solid var(--accent); background: var(--panel); }
  .v2 header .nav { display: flex; gap: 18px; }
  .v2 header .nav a { font-size: 13px; }
  .v2 main { width: 640px; margin: 14px auto 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .v2 .ribbon { display: flex; gap: 12px; align-items: center; border-radius: 8px; padding: 10px 14px; }
  .v2 .ribbon .photo { width: 64px; height: 44px; flex: none; border-radius: 6px; }
  .v2 .ribbon h1 { font-size: 18px; }
  .v2 .ribbon .acts { margin-left: auto; display: flex; gap: 6px; }
  .v2 .rooms { display: flex; flex-direction: column; gap: 6px; }
  .v2 .room { padding: 6px 10px; }
  .v2 .room .sw { width: 28px; height: 28px; }
  .v2 .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .v2 .summary { border-radius: 8px; padding: 10px 14px; }
  .v2 .summary .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .v2 .ctl { display: flex; gap: 12px; align-items: center; }
  .v2 .ctl .btn.solid { flex: 1; padding: 10px; }
  .v2 .foot { display: flex; gap: 16px; justify-content: center; }

  /* ===== v3: summary column left, roomy card grid right, side header on the right edge ===== */
  .v3 { display: grid; grid-template-columns: 330px 1fr 150px; height: 800px; }
  .v3 .sumcol { background: var(--panel); border-right: 1px solid var(--line); padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; }
  .v3 .sumcol .photo { height: 150px; }
  .v3 .sumcol h1 { font-size: 22px; }
  .v3 .grid { padding: 28px 30px; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: min-content; gap: 18px; align-content: start; }
  .v3 .grid .card { border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .v3 .grid .card h3 { font-size: 16px; }
  .v3 .grid .card.full { grid-column: 1 / -1; }
  .v3 .rooms { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .v3 .rooms .room { flex-direction: column; align-items: flex-start; padding: 14px; gap: 8px; }
  .v3 .rooms .room .sw { width: 100%; height: 50px; }
  .v3 .rail { border-left: 1px solid var(--line); background: var(--bg); padding: 28px 16px; display: flex; flex-direction: column; gap: 22px; }
  .v3 .rail .nav { display: flex; flex-direction: column; gap: 14px; }
  .v3 .rail .acts { display: flex; gap: 8px; }
  .v3 .rail .foot { margin-top: 20px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// Shared runtime for the FULL-study pages (PreflightBench-Live). pages_full/build.py inlines it into each page.
// Fresh code path from the pilot runtime, extended with: template variants (?v=), dialog kinds, slow load,
// near/away background motion, virtual (canvas) targets, and dialog/settled truth.
// All motion uses setTimeout/setInterval and Date.now(), so Playwright's clock controls it. No rAF.
(function () {
  const Q = new URLSearchParams(location.search);
  const seed = parseInt(Q.get('seed') || '1', 10);
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const bg = mulberry32(seed * 7919 + 1);       // background motion and content
  const ev = mulberry32(seed * 104729 + 7);     // seeded events only
  const P = {
    seed, Q, mulberry32,
    variant: parseInt(Q.get('v') || '0', 10),   // template variant: layout + theme
    motion: Q.get('motion') || 'med',
    rand: bg, evRand: ev,
    pick: (a, r = bg) => a[Math.floor(r() * a.length)],
    between: (lo, hi, r = bg) => lo + (hi - lo) * r(),
    level: (low, med, high) => ({ low, med, high, none: null }[Q.get('motion') || 'med']),
    t0: Date.now(),
    hooks: {},
    virtual: {},  // canvas targets: id -> {box: () => [x,y,w,h] | null, valid: () => bool}
  };
  window.P = P;

  // Fictional vocabulary only.
  const WORDS = ('aster bramble cobalt dune ember fennel glacier heron iris jasper kelp lark moss nettle opal ' +
    'plover quill reed sorrel tansy umbra vesper wren yucca zinnia beacon cinder drift ferry gable hollow ' +
    'inlet jetty knoll ledge mantle nook outpost prism ridge sable tarn').split(' ');
  P.words = (n, r = bg) => Array.from({ length: n }, () => P.pick(WORDS, r)).join(' ');
  P.sentence = (n, r = bg) => { const s = P.words(n, r); return s[0].toUpperCase() + s.slice(1) + '.'; };
  P.name = (r = bg) => P.pick(['Avery', 'Bo', 'Cass', 'Dev', 'Eli', 'Fen', 'Gray', 'Hollis', 'Indy', 'Jules', 'Kit', 'Lane', 'Mar', 'Noor', 'Oak', 'Pax'], r) +
    ' ' + P.pick(['Ashdown', 'Brightwater', 'Coldbrook', 'Dunmore', 'Elmsworth', 'Fairholt', 'Greyling', 'Hartwell'], r);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  P.el = el;

  // ---------- themes (template variants) ----------
  // Four palettes x font stacks. Pages also change layout by P.variant; the palette only changes look.
  const THEMES = [
    { bg: '#f6f7f9', panel: '#ffffff', ink: '#1d232a', muted: '#66707a', accent: '#2e6bd9', line: '#dde2e8', font: '-apple-system, Helvetica, Arial, sans-serif' },
    { bg: '#fbf8f3', panel: '#fffdf9', ink: '#2a2420', muted: '#7a6f66', accent: '#b4552d', line: '#e8dfd3', font: 'Georgia, "Times New Roman", serif' },
    { bg: '#11161c', panel: '#1a222b', ink: '#e7ecf1', muted: '#93a1ae', accent: '#3fb68b', line: '#2a3540', font: 'Verdana, Geneva, sans-serif' },
    { bg: '#eef3ef', panel: '#f9fcfa', ink: '#1c2a22', muted: '#5f7368', accent: '#6b4fbb', line: '#d3dfd7', font: '"Trebuchet MS", Tahoma, sans-serif' },
  ];
  P.theme = THEMES[P.variant % THEMES.length];
  P.applyTheme = function () {
    const t = P.theme, s = document.documentElement.style;
    Object.entries(t).forEach(([k, v]) => s.setProperty('--' + k, v));
  };

  // ---------- targets ----------
  function target() {
    const id = window.__pfTarget || Q.get('target');
    return id ? document.querySelector(`[data-target-id="${id}"]`) : null;
  }
  P.target = target;
  function targetId() { return window.__pfTarget || Q.get('target'); }
  function blockOf(t) { return (P.hooks.blockOf && P.hooks.blockOf(t)) || t.closest('[data-block]') || t; }

  // ---------- events ----------
  function spacer(h, r) {
    const s = el('div', 'pf-inserted');
    s.style.cssText = `height:${h}px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--muted);` +
      `border-radius:6px;margin:0 0 8px 0;padding:8px 12px;font-size:13px;overflow:hidden;grid-column:1/-1;`;
    s.textContent = P.pick(['Update available. ', 'Section expanded. ', 'New items below. ', 'Notice: '], r) + P.sentence(10, r);
    return s;
  }
  function doMoved(r) {
    const id = targetId();
    if (P.virtual[id] && P.hooks.moveVirtual) return P.hooks.moveVirtual(id, r);
    const t = target(); if (!t) return;
    const h = Math.round(P.between(10, 300, r));
    if (P.hooks.moveTarget) return P.hooks.moveTarget(t, h, r);
    const b = blockOf(t);
    b.parentNode.insertBefore(spacer(h, r), b);
  }
  function doLookalike(r) {
    const id = targetId();
    if (P.virtual[id] && P.hooks.lookalikeVirtual) return P.hooks.lookalikeVirtual(id, r);
    const t = target(); if (!t) return;
    const b = blockOf(t);
    const c = b.cloneNode(true);
    c.querySelectorAll('[data-target-id]').forEach(e => e.removeAttribute('data-target-id'));
    c.removeAttribute('data-target-id');
    c.querySelectorAll('[data-vary]').forEach(e => {
      const n = e.textContent.split(/\s+/).length;
      e.textContent = e.dataset.vary === 'num' ? String(Math.round(P.between(10, 999, r))) : P.sentence(Math.max(2, n), r);
    });
    // Mark the clone without touching its class when the clone IS the control (no block): truth compares
    // tag + text + className, so an extra class would hide an identical look-alike.
    if (b === t) c.dataset.pfLookalike = '1'; else c.classList.add('pf-lookalike');
    if (P.hooks.lookalike) return P.hooks.lookalike(t, b, c, r);
    b.parentNode.insertBefore(c, b);
  }
  // Dialog kinds: modal overlays that cover part of the page (label `dialog`).
  const DIALOGS = ['session_timeout', 'cookie_consent', 'styled_dialog'];
  function doDialog(r, kind) {
    kind = kind || P.pick(DIALOGS, r);
    let c = el('div', 'pf-cover pf-dialog');
    if (kind === 'cookie_consent') {
      const h = 120 + Math.round(r() * 50), bottom = r() < .5;
      c.style.cssText = `position:fixed;left:0;right:0;${bottom ? 'bottom' : 'top'}:0;height:${h}px;background:#1f2429;color:#f1f1f1;` +
        'z-index:900;padding:18px 36px;box-sizing:border-box;font:14px -apple-system,Arial,sans-serif;';
      c.append(el('div', null, 'We use cookies to keep you signed in and to measure traffic. ' + P.sentence(6, r)));
      const row = el('div'); row.style.marginTop = '10px';
      ['Accept all', 'Reject', 'Settings'].forEach(t => { const b = el('button', null, t); b.style.cssText = 'margin-right:8px;padding:6px 12px;font:inherit;'; row.append(b); });
      c.append(row);
    } else {
      c.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:900;display:flex;align-items:center;justify-content:center;';
      const d = el('div');
      if (kind === 'session_timeout') {
        d.style.cssText = 'background:#fff;color:#222;border-radius:8px;padding:24px 28px;width:400px;font:14px -apple-system,Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);';
        d.append(el('h3', null, 'Your session is about to expire'), el('p', null, 'For your security you will be signed out in 2 minutes. ' + P.sentence(6, r)));
        const b = el('button', null, 'Stay signed in'); b.style.cssText = 'padding:7px 14px;font:inherit;'; d.append(b);
      } else {  // styled like the page: same palette and font
        d.style.cssText = 'background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:22px 26px;width:420px;font-family:var(--font);font-size:14px;';
        d.append(el('h3', null, P.pick(['Before you continue', 'Quick question', 'Something changed'], r)), el('p', null, P.sentence(14, r)));
        const b = el('button', null, P.pick(['Got it', 'Continue', 'OK'], r));
        b.style.cssText = 'padding:7px 14px;background:var(--accent);color:#fff;border:0;border-radius:6px;font:inherit;'; d.append(b);
      }
      c.append(d);
    }
    c.dataset.coverKind = kind;
    document.body.append(c);
  }
  // Non-dialog covers over the target: toast or popover (they cover the click but are not dialogs).
  function doCovered(r) {
    const id = targetId(), t = target();
    const bx = P.virtual[id] ? P.virtual[id].box() : (t && t.getBoundingClientRect() && (b => [b.left, b.top, b.width, b.height])(t.getBoundingClientRect()));
    if (!bx) return;
    const cx = bx[0] + bx[2] / 2, cy = bx[1] + bx[3] / 2;
    const kind = P.pick(['toast', 'popover'], r);
    const c = el('div', 'pf-cover');
    const w = kind === 'toast' ? 320 : 240, h = kind === 'toast' ? 56 : 110;
    const left = Math.max(0, Math.min(1280 - w, cx - w / 2 + (r() - .5) * (w * .5)));
    const top = Math.max(0, Math.min(800 - h, cy - h / 2 + (r() - .5) * (h * .5)));
    c.style.cssText = `position:fixed;left:${left}px;top:${top}px;width:${w}px;height:${h}px;z-index:900;box-sizing:border-box;` +
      'padding:12px 14px;border-radius:8px;font:13px -apple-system,Arial,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.18);' +
      (kind === 'toast' ? 'background:#2b3137;color:#fff;' : 'background:#fff;color:#222;border:1px solid #ccd;');
    c.textContent = kind === 'toast' ? 'Saved. ' + P.words(4, r) : 'Tip: ' + P.sentence(9, r);
    c.dataset.coverKind = kind;
    document.body.append(c);
  }
  function doGone(r) {
    const id = targetId();
    if (P.virtual[id] && P.hooks.goneVirtual) return P.hooks.goneVirtual(id, r);
    const t = target(); if (!t) return;
    const kind = P.pick(['removed', 'disabled', 'label'], r);
    if (kind === 'removed') t.remove();
    else if (kind === 'disabled') { t.disabled = true; t.dataset.pfDisabled = '1'; t.style.opacity = '0.4'; t.style.pointerEvents = 'none'; }
    else { t.textContent = t.dataset.alt || (t.textContent.trim() + 'd'); }
    document.documentElement.dataset.goneKind = kind;
  }
  // Slow load: the target's block is swapped for a loading skeleton, and comes back after `slow_ms`
  // (it may come back at a different height, so neighbours shift).
  function doSlowLoad(r) {
    const t = target(); if (!t) return;
    const b = blockOf(t);
    const sk = el('div', 'pf-skeleton');
    const rect = b.getBoundingClientRect();
    sk.style.cssText = `height:${Math.max(20, rect.height + Math.round(P.between(-10, 40, r)))}px;background:var(--line);border-radius:6px;margin:0 0 8px 0;`;
    const disp = b.style.display;
    b.style.display = 'none';
    b.parentNode.insertBefore(sk, b);
    const back = parseFloat(Q.get('slow_ms') || '3000');
    setTimeout(() => { sk.remove(); b.style.display = disp; }, back);
  }
  const EVENTS = { none: () => {}, moved: doMoved, moved_lookalike: doLookalike, covered: doCovered, gone: doGone,
    dialog: r => doDialog(r), slow_load: doSlowLoad };
  P.events = EVENTS;
  function schedule(name, at) {
    if (!name || name === 'none' || !(at >= 0)) return;
    setTimeout(() => { EVENTS[name](ev); document.documentElement.dataset['ev_' + name] = String(Date.now() - P.t0); }, at);
  }
  P.startEvents = function () {
    schedule(Q.get('event'), parseFloat(Q.get('event_at')));
    schedule(Q.get('event2'), parseFloat(Q.get('event2_at')));
  };

  // ---------- background motion near / away from the target (?bg=near|away) ----------
  // A spinner or a typing caret, placed within 20-60 px of the target ('near') or far from it ('away').
  P.startBgMotion = function () {
    const where = Q.get('bg'); if (!where || where === 'none') return;
    const r = mulberry32(seed * 31337 + 3);
    const id = targetId(), t = target();
    const bx = P.virtual[id] ? P.virtual[id].box() : (t ? (b => [b.left, b.top, b.width, b.height])(t.getBoundingClientRect()) : null);
    if (!bx) return;
    const kind = P.pick(['spinner', 'caret'], r);
    const s = el('div', 'pf-bgmotion');
    let x, y;
    if (where === 'near') {
      const side = P.pick(['l', 'r', 'u', 'd'], r), d = P.between(20, 60, r);
      x = side === 'l' ? bx[0] - d - 18 : side === 'r' ? bx[0] + bx[2] + d : bx[0] + bx[2] / 2;
      y = side === 'u' ? bx[1] - d - 18 : side === 'd' ? bx[1] + bx[3] + d : bx[1] + bx[3] / 2 - 9;
    } else {
      do { x = P.between(20, 1240, r); y = P.between(20, 760, r); } while (Math.abs(x - bx[0]) < 300 && Math.abs(y - bx[1]) < 200);
    }
    x = Math.max(2, Math.min(1260, x)); y = Math.max(2, Math.min(780, y));
    s.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:18px;height:18px;z-index:850;pointer-events:none;`;
    document.body.append(s);
    let k = 0;
    if (kind === 'spinner') {
      s.style.border = '3px solid var(--line)'; s.style.borderTopColor = 'var(--accent)'; s.style.borderRadius = '50%'; s.style.boxSizing = 'border-box';
      setInterval(() => { s.style.transform = `rotate(${(k += 30) % 360}deg)`; }, 50);
    } else {
      s.style.width = '2px'; s.style.background = 'var(--ink)';
      setInterval(() => { s.style.visibility = (k++ % 2) ? 'hidden' : 'visible'; }, 530);
    }
    document.documentElement.dataset.bgKind = kind;
  };

  // ---------- last action (worked set) ----------
  // Page defines P.action = {id, smallSel?, smallLabel, panelText}. Outcome from ?outcome=.
  P.wireAction = function () {
    const cfg = P.action; if (!cfg) return;
    const btn = document.querySelector(`[data-action-id="${cfg.id}"]`); if (!btn) return;
    btn.dataset.label = btn.textContent;
    btn.addEventListener('click', () => {
      const o = Q.get('outcome') || 'success_clear';
      if (o === 'success_clear') {
        const p = el('div', 'pf-panel');
        const b = btn.getBoundingClientRect();
        const top = Math.min(800 - 130, b.bottom + 10), left = Math.max(10, Math.min(1280 - 360, b.left - 120));
        p.style.cssText = `position:fixed;left:${left}px;top:${top}px;width:340px;height:110px;background:var(--panel);` +
          'border:2px solid var(--accent);border-radius:10px;padding:16px 18px;box-sizing:border-box;color:var(--ink);font-size:15px;z-index:800;font-family:var(--font);';
        p.append(el('div', null, cfg.panelText), el('div', null, P.sentence(5)));
        document.body.append(p);
      } else if (o === 'success_small') {
        const e = cfg.smallSel ? document.querySelector(cfg.smallSel) : btn;
        e.textContent = cfg.smallLabel;
      } else if (o === 'failed_error') {
        const t = el('div', 'pf-error', cfg.errorText || "Couldn't complete that. Try again.");
        t.style.cssText = 'position:fixed;right:24px;bottom:24px;background:#b3261e;color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;z-index:950;';
        document.body.append(t);
        setTimeout(() => t.remove(), 3000);
      } // failed_silent: nothing
    });
  };

  // ---------- truth, read by the generator ----------
  function validDom(t) {
    return !!(t && t.isConnected && !t.disabled && !t.dataset.pfDisabled && t.offsetParent !== null &&
      (t.dataset.label == null || t.textContent === t.dataset.label));
  }
  function topCover(x, y) {
    const e = document.elementFromPoint(x, y);
    return e && e.closest('.pf-cover, .pf-panel, .pf-skeleton') ? e : null;
  }
  function hits(id, t, x, y) {
    if (x < 0 || y < 0 || x >= innerWidth || y >= innerHeight) return false;
    const v = P.virtual[id];
    if (v) {  // canvas target: inside its render-state box, and the canvas itself is what is on top
      const b = v.box(); if (!b || !v.valid()) return false;
      if (!(x >= b[0] && x < b[0] + b[2] && y >= b[1] && y < b[1] + b[3])) return false;
      const e = document.elementFromPoint(x, y);
      return !!(e && e.tagName === 'CANVAS' && (!v.canvas || e === v.canvas));
    }
    const e = document.elementFromPoint(x, y);
    return !!(e && (e === t || t.contains(e)));
  }
  function dialogVisible() {
    return Array.from(document.querySelectorAll('.pf-dialog')).some(d => { const b = d.getBoundingClientRect(); return b.width > 0 && b.height > 0; });
  }
  window.__truth = function (px, py) {
    const id = targetId(), v = P.virtual[id], t = v ? null : target();
    const ok = v ? v.valid() : validDom(t);
    const out = { go_ok: ok && hits(id, t, px, py), target_exists: ok, target_box: null, hit_mask: null,
      covered: false, lookalike_boxes: [], center_hit: false, dialog: dialogVisible(),
      overlay: !!document.querySelector('.pf-cover'), click_on_cover: !!topCover(px, py) };
    const b = v ? v.box() : (t && t.isConnected && t.offsetParent !== null ? (r => [r.left, r.top, r.width, r.height])(t.getBoundingClientRect()) : null);
    if (b) {
      out.target_box = b;
      const cx = b[0] + b[2] / 2, cy = b[1] + b[3] / 2;
      out.center_hit = ok && hits(id, t, cx, cy);
      const inView = cx >= 0 && cy >= 0 && cx < innerWidth && cy < innerHeight;
      out.covered = ok && inView && !out.center_hit;
      const mask = [];
      for (let y = Math.ceil(b[1] / 4) * 4; y < b[1] + b[3]; y += 4)
        for (let x = Math.ceil(b[0] / 4) * 4; x < b[0] + b[2]; x += 4)
          if (ok && hits(id, t, x, y)) mask.push([x, y]);
      out.hit_mask = mask;
      if (t) {
        const sig = e => e.tagName + '|' + e.textContent.trim() + '|' + e.className;
        const s = sig(t);
        document.querySelectorAll(t.tagName).forEach(e => {
          if (e === t || sig(e) !== s) return;
          const r = e.getBoundingClientRect();
          if (r.width > 0 && r.bottom > 0 && r.top < innerHeight) out.lookalike_boxes.push([r.left, r.top, r.width, r.height]);
        });
      } else if (P.hooks.virtualLookalikes) out.lookalike_boxes = P.hooks.virtualLookalikes(id);
      out.unique = out.lookalike_boxes.length === 0;
    }
    out.correct_action = out.go_ok ? 'go' : (out.target_exists && out.center_hit ? 'reaim' : 'replan');
    return out;
  };
  window.__targets = () => {
    const dom = Array.from(document.querySelectorAll('[data-target-id]')).filter(e => e.offsetParent !== null).map(e => {
      const b = e.getBoundingClientRect();
      return { id: e.dataset.targetId, box: [b.left, b.top, b.width, b.height] };
    });
    const virt = Object.entries(P.virtual).map(([id, v]) => ({ id, box: v.box() })).filter(o => o.box);
    return dom.concat(virt);
  };
  window.__actionBox = () => {
    const b = document.querySelector('[data-action-id]'); if (!b) return null;
    const r = b.getBoundingClientRect(); return [r.left, r.top, r.width, r.height];
  };

  document.addEventListener('DOMContentLoaded', () => {
    P.applyTheme();
    if (P.init) P.init();
    document.querySelectorAll('[data-target-id]').forEach(e => { if (e.dataset.label == null) e.dataset.label = e.textContent; });
    P.wireAction();
    P.startEvents();
    // background motion starts after targets exist; the generator sets the target before load via ?target=
    setTimeout(() => P.startBgMotion(), 0);
  });
})();

</script>
<script>
P.init = function () {
  const r = P.rand, el = P.el, v = P.variant % 4;
  const app = document.getElementById('app');
  app.className = 'v' + v;

  // ---------- content (fictional) ----------
  const place = P.pick(['Larkspur Hollow', 'Tansy Reach', 'Wrenfold', 'Sorrel Knoll']);
  const vale = P.pick(['Ferrowmere Vale', 'Quillby Downs', 'Ashcombe Fen', 'Brindle Moor']);
  const nights = 2 + Math.floor(r() * 4);
  const day = 3 + Math.floor(r() * 20);
  const month = P.pick(['Mar', 'Apr', 'May', 'Sep', 'Oct']);
  const rooms = [
    { id: 'room-fern', name: 'Fern room', note: 'Garden view · queen bed', price: 90 + Math.round(r() * 40), col: '#7fa37a' },
    { id: 'room-heron', name: 'Heron loft', note: 'Skylight · twin beds', price: 120 + Math.round(r() * 40), col: '#6e8fb0' },
    { id: 'room-tarn', name: 'Tarn suite', note: 'Lake side · king bed', price: 170 + Math.round(r() * 60), col: '#b08a5e' },
  ];
  const selIdx = Math.floor(r() * 3);
  const sel = rooms[selIdx];
  const fee = 12 + Math.round(r() * 10);
  const total = sel.price * nights + fee;

  // ---------- helpers ----------
  function T(e, id, alt) { e.dataset.targetId = id; e.dataset.alt = alt; return e; }
  function link(text, id, alt, cls) { const a = el('a', cls || null, text); a.href = '#'; a.addEventListener('click', ev => ev.preventDefault()); return T(a, id, alt); }
  const SVG = {
    heart: '<svg viewBox="0 0 16 16"><path d="M8 14 2.5 8.6A3.2 3.2 0 0 1 8 4a3.2 3.2 0 0 1 5.5 4.6Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    share: '<svg viewBox="0 0 16 16"><circle cx="4" cy="8" r="2" fill="currentColor"/><circle cx="12" cy="3.5" r="2" fill="currentColor"/><circle cx="12" cy="12.5" r="2" fill="currentColor"/><path d="M4 8 12 3.5M4 8l8 4.5" stroke="currentColor" stroke-width="1.3"/></svg>',
  };
  function iconBtn(kind, id, alt, cls) {
    const b = el('button', 'icon ' + cls); b.innerHTML = SVG[kind]; b.title = kind; return T(b, id, alt);
  }
  function brand() {
    const d = el('div', 'brand');
    d.innerHTML = '<svg class="mark" viewBox="0 0 30 30"><rect width="30" height="30" rx="7" fill="var(--accent)"/><path d="M7 21 15 9l8 12Z" fill="#fff" opacity=".9"/></svg>';
    const t = el('div'); t.append(el('b', null, place), el('small', null, 'Guesthouse · ' + vale)); d.append(t);
    return d;
  }
  function nav() {
    const n = el('nav', 'nav'); n.dataset.block = '';
    n.append(link('Rooms', 'nav-rooms', 'All rooms'), link('Dining hall', 'nav-dining', 'Dining'),
      el('a', null, 'Getting here'), link('Sign in', 'nav-signin', 'Signed in', 'signin'));
    return n;
  }
  function photo(c1, c2, h) {
    const p = el('div', 'photo');
    p.style.background = c1;
    p.innerHTML = `<svg viewBox="0 0 100 60" preserveAspectRatio="none"><rect y="38" width="100" height="22" fill="${c2}"/>` +
      `<polygon points="0,38 30,16 55,38" fill="${c2}" opacity=".7"/><polygon points="40,38 70,10 100,38" fill="${c2}" opacity=".5"/>` +
      `<circle cx="80" cy="14" r="5" fill="#fff" opacity=".7"/></svg>`;
    if (h) p.style.height = h + 'px';
    return p;
  }
  function acts() {
    const a = el('div', 'acts'); a.dataset.block = '';
    a.append(iconBtn('heart', 'icon-save', 'Saved', 'save'), iconBtn('share', 'icon-share', 'Shared', 'share'));
    return a;
  }
  function roomCard(o, i) {
    const c = el('div', 'room' + (i === selIdx ? ' sel' : '')); c.dataset.block = '';
    const sw = el('div', 'sw'); sw.style.background = o.col;
    const info = el('div', 'info');
    info.append(el('b', null, o.name)); const n = el('span', null, o.note); n.dataset.vary = ''; info.append(n);
    const pr = el('div', 'price'); pr.append('£'); const num = el('span', null, String(o.price)); num.dataset.vary = 'num'; pr.append(num, el('span', 'muted', ' /night'));
    const b = el('button', 'btn' + (i === selIdx ? ' solid' : ''), i === selIdx ? 'Selected: ' + o.name.split(' ')[0] : 'Choose ' + o.name.split(' ')[0]);
    T(b, o.id, o.name.split(' ')[0] + ' unavailable');
    c.append(sw, info, pr, b);
    return c;
  }
  function roomsBox() { const d = el('div', 'rooms'); rooms.forEach((o, i) => d.append(roomCard(o, i))); return d; }
  function field(label, val, extra) {
    const f = el('div', 'field'); f.append(el('label', null, label));
    const b = el('div', 'box'); b.append(el('span', 'val', val)); if (extra) b.append(extra); f.append(b); return f;
  }
  function fields() {
    const fs = el('div', 'fields');
    const editIn = el('button', 'link', 'Change'); T(editIn, 'date-change', 'Date locked');
    fs.append(field('Check-in', `${day} ${month}`, editIn));
    fs.append(field('Check-out', `${day + nights} ${month}`));
    fs.append(field('Arrival time', P.pick(['14:00', '15:30', '16:00', '17:30'])));
    const st = el('div', 'stepper');
    st.append(T(el('button', 'icon minus', '−'), 'guest-minus', '·'), T(el('button', 'icon plus', '+'), 'guest-plus', '±'));
    const g = field('Guests', String(1 + Math.floor(r() * 3)) + ' adults', st);
    g.dataset.block = ''; fs.append(g);
    return fs;
  }
  function promo() {
    const d = el('div', 'promo'); d.dataset.block = '';
    d.style.cssText = 'display:flex;align-items:center;gap:10px;font-size:13px;';
    const t = el('span', 'muted', 'Have a voucher from ' + P.words(2) + '?'); t.dataset.vary = '';
    d.append(t, T(el('button', 'btn', 'Apply voucher'), 'promo-apply', 'Voucher applied'));
    return d;
  }
  function chips() { const c = el('div', 'chips'); ['Breakfast', 'Wood stove', 'Bike shed', 'Quiet hours 22:00'].forEach(x => c.append(el('span', 'chip', x))); return c; }
  function summaryRows() {
    const w = el('div', 'rows');
    const row = (a, b, cls) => { const d = el('div', 'sum-row' + (cls ? ' ' + cls : '')); d.append(el('span', null, a), el('span', null, b)); return d; };
    w.append(row(sel.name, `£${sel.price} × ${nights}`), row('Service', `£${fee}`), row('Dates', `${day}–${day + nights} ${month}`), row('Total', `£${total}`, 'total'));
    return w;
  }
  function reserve(cls) {
    const b = el('button', 'btn solid ' + (cls || ''), 'Reserve stay');
    b.dataset.actionId = 'reserve';
    return T(b, 'reserve', 'Reserve unavailable');
  }
  function status() { const s = el('div', 'status', 'Not yet reserved · free cancellation'); s.id = 'status'; return s; }
  function policy() { const d = el('div'); d.dataset.block = ''; d.style.fontSize = '13px'; d.append(link('Cancellation policy', 'policy', 'Policy updated')); return d; }
  function foot() {
    const f = el('div', 'foot'); f.dataset.block = ''; f.append(link('Help desk', 'foot-help', 'Help closed'), link('House rules', 'foot-rules', 'Rules revised'), el('a', null, '© ' + place));
    return f;
  }
  function about(n) { const p = el('p', 'muted'); p.style.margin = '0'; p.textContent = P.sentence(n); return p; }

  // ---------- layouts ----------
  if (v === 0) {
    const h = el('header'); h.append(brand(), nav()); app.append(h);
    const m = el('main'); const L = el('div', 'left');
    const tb = el('div', 'titlebar'); const tt = el('div'); tt.append(el('h1', null, 'Book your stay'), el('div', 'muted', vale + ' · ' + nights + ' nights')); tb.append(tt, acts());
    const g = el('div', 'gallery'); g.append(photo('#9fb7c9', '#5f7d62'), photo('#c9b49f', '#7d6a5f'), photo('#b3c9a0', '#55704a'));
    L.append(tb, g, roomsBox(), fields(), promo());
    const A = el('aside', 'panel'); A.append(el('h2', null, 'Your stay'), summaryRows(), policy(), reserve('wide'), status());
    m.append(L, A); app.append(m, foot());
  } else if (v === 1) {
    const s = el('div', 'side'); s.append(brand(), nav(), foot()); app.append(s);
    const c = el('div', 'content');
    const hd = el('div', 'head'); const tt = el('div'); tt.append(el('h1', null, 'Reserve at ' + place), el('div', 'muted', about(8).textContent));
    hd.append(photo('#a9c0b8', '#4f6e66', 80), tt, acts());
    const s1 = el('div', 'step panel'); s1.innerHTML = '<h3><i>1</i>Pick a room</h3>'; s1.append(roomsBox());
    const s2 = el('div', 'step panel'); s2.innerHTML = '<h3><i>2</i>Dates and guests</h3>'; s2.append(fields());
    const s3 = el('div', 'step panel'); s3.innerHTML = '<h3><i>3</i>Extras</h3>'; s3.style.display = 'flex'; s3.style.alignItems = 'center'; s3.style.justifyContent = 'space-between';
    s3.firstChild.style.margin = '0'; s3.append(promo(), policy());
    const strip = el('div', 'strip panel');
    const rows = summaryRows(); Array.from(rows.children).slice(0, 3).forEach(x => strip.append(x));
    const last = el('div'); last.style.cssText = 'display:flex;flex-direction:column;gap:6px;';
    last.append(el('b', null, 'Total £' + total), reserve('wide'), status()); strip.append(last);
    c.append(hd, s1, s2, s3, strip); app.append(c);
  } else if (v === 2) {
    const h = el('header'); h.append(brand(), nav()); app.append(h);
    const m = el('main');
    const rb = el('div', 'ribbon panel'); const tt = el('div'); tt.append(el('h1', null, place + ' booking'), el('div', 'muted', vale));
    rb.append(photo('#d0b8a0', '#836247', 44), tt, acts());
    const sm = el('div', 'summary panel'); sm.append(summaryRows());
    const ctl = el('div', 'ctl'); ctl.append(status(), reserve()); const ctlWrap = el('div'); ctlWrap.append(ctl);
    m.append(rb, roomsBox(), fields(), promo(), chips(), sm, policy(), ctlWrap, foot());
    app.append(m);
  } else {
    const sc = el('div', 'sumcol');
    sc.append(brand(), photo('#9cb0c6', '#4a5f78', 150), el('h1', null, 'Your stay at ' + place), about(12), summaryRows(), reserve('wide'), status(), policy());
    const g = el('div', 'grid');
    const c1 = el('div', 'card panel full'); c1.append(el('h3', null, 'Choose a room'), roomsBox());
    const c2 = el('div', 'card panel full'); c2.append(el('h3', null, 'When are you coming?'), fields()); c2.querySelector('.fields').style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:14px;';
    const c3 = el('div', 'card panel'); c3.append(el('h3', null, 'Vouchers'), promo());
    const c4 = el('div', 'card panel'); c4.append(el('h3', null, 'In every room'), chips());
    g.append(c1, c2, c3, c4);
    const rl = el('div', 'rail'); rl.append(nav(), acts(), foot());
    app.append(sc, g, rl);
  }

  // 'moved': the default spacer would land inside a horizontal row (header, title bar) and push the target
  // sideways or not at all. Climb out of flex rows first so the spacer pushes the whole row down.
  P.hooks.moveTarget = function (t, h, rr) {
    let x = t.closest('[data-block]') || t;
    const isRow = e => { const cs = getComputedStyle(e); return cs.display.includes('flex') && cs.flexDirection.startsWith('row'); };
    while (x.parentElement && x.parentElement !== app && isRow(x.parentElement)) x = x.parentElement;
    const s = el('div', 'pf-inserted');
    s.style.cssText = `height:${h}px;flex:none;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--muted);` +
      `border-radius:6px;margin:0 0 8px 0;padding:8px 12px;font-size:13px;overflow:hidden;grid-column:1/-1;`;
    s.textContent = P.pick(['Update available. ', 'Section expanded. ', 'New items below. ', 'Notice: '], rr) + P.sentence(10, rr);
    x.parentNode.insertBefore(s, x);
  };

  P.action = { id: 'reserve', smallLabel: 'Reserved ✓', panelText: 'Stay reserved at ' + place + '.', smallSel: v === 2 ? '#status' : undefined };
};
</script>
