<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Newsfeed</title>
<style>
  * { box-sizing: border-box; caret-color: transparent; animation: none !important; transition: none !important; }
  html, body { width: 1280px; height: 800px; overflow: hidden; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); }
  button { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
  button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  a { color: var(--accent); text-decoration: none; }
  .muted { color: var(--muted); }
  /* shared pieces */
  .topbar { display: flex; align-items: center; gap: 16px; padding: 0 22px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 19px; letter-spacing: .01em; }
  .brand i { font-style: normal; color: var(--accent); }
  .search { height: 32px; border: 1px solid var(--line); border-radius: 16px; padding: 6px 14px; color: var(--muted); font-size: 13px; background: var(--bg); }
  .grow { flex: 1; }
  .ticker { position: relative; overflow: hidden; white-space: nowrap; height: 28px; font-size: 12px; line-height: 28px; background: var(--ink); color: var(--panel); }
  .ticker .lab { position: absolute; left: 0; top: 0; bottom: 0; z-index: 2; background: var(--accent); color: #fff; padding: 0 12px; font-weight: 700; letter-spacing: .06em; }
  .ticker .run { position: absolute; left: 0; top: 0; }
  .status { height: 30px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .pill { background: var(--accent); color: #fff; border-radius: 12px; padding: 2px 12px; font-size: 12px; font-weight: 600; visibility: hidden; }
  .livebar { width: 90px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .livebar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .feed { position: relative; overflow: hidden; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; margin-bottom: 10px; display: flex; gap: 12px; }
  .card .bd { flex: 1; min-width: 0; }
  .meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .meta .src { font-weight: 700; color: var(--ink); }
  .card h3 { margin: 4px 0 4px; font-size: 16px; line-height: 1.25; }
  .card p { margin: 0 0 7px; font-size: 13px; color: var(--muted); }
  .acts { display: flex; gap: 6px; align-items: center; }
  .acts .cnt { font-size: 11px; color: var(--muted); min-width: 22px; }
  .acts .more { margin-left: auto; }
  .thumb { flex: none; border-radius: 6px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; margin-bottom: 12px; }
  .box h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .trend { display: flex; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .trend:last-child { border-bottom: 0; }
  .trend .n { color: var(--muted); width: 16px; }
  .trend .c { margin-left: auto; color: var(--muted); font-size: 11px; }
  .field { height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; color: var(--muted); font-size: 12px; background: var(--bg); margin-bottom: 8px; }
  .srcrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .srcrow .sq { width: 22px; height: 22px; border-radius: 5px; flex: none; }
  .nav a { display: block; padding: 7px 10px; border-radius: 6px; color: var(--ink); font-size: 14px; }
  .nav a.on { background: var(--line); font-weight: 700; }

  /* v0: centered feed with two sidebars */
  .v0 .topbar { height: 56px; }
  .v0 .search { width: 340px; }
  .v0 .main { display: grid; grid-template-columns: 190px 620px 1fr; gap: 22px; padding: 14px 22px; height: 686px; }
  .v0 .feed { height: 628px; }
  /* v1: feed left + right rail */
  .v1 .topbar { height: 50px; }
  .v1 .search { width: 260px; }
  .v1 .main { display: grid; grid-template-columns: 820px 1fr; gap: 24px; padding: 12px 24px; height: 722px; }
  .v1 .feed { height: 680px; }
  .v1 .card { padding: 12px; }
  .v1 .card h3 { font-size: 18px; }
  .v1 .tabs { display: flex; gap: 4px; }
  .v1 .tabs a { padding: 6px 12px; border-radius: 16px; color: var(--ink); font-size: 13px; }
  .v1 .tabs a.on { background: var(--accent); color: #fff; }
  /* v2: two-column masonry */
  .v2 .topbar { height: 52px; }
  .v2 .search { width: 220px; }
  .v2 .chips { display: flex; gap: 6px; height: 40px; align-items: center; padding: 0 22px; border-bottom: 1px solid var(--line); overflow: hidden; }
  .v2 .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 3px 11px; font-size: 12px; white-space: nowrap; }
  .v2 .main { display: grid; grid-template-columns: 920px 1fr; gap: 20px; padding: 10px 22px; height: 708px; }
  .v2 .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 670px; }
  .v2 .feed { height: 670px; }
  .v2 .card { flex-direction: column; gap: 8px; }
  .v2 .card h3 { font-size: 15px; }
  /* v3: compact list */
  .v3 .topbar { height: 44px; background: var(--accent); color: #fff; border: 0; }
  .v3 .topbar .search { width: 260px; height: 28px; padding: 4px 12px; }
  .v3 .topbar a { color: #fff; font-size: 13px; }
  .v3 .brand i { color: #fff; text-decoration: underline; }
  .v3 .main { display: grid; grid-template-columns: 170px 790px 1fr; gap: 18px; padding: 10px 18px; height: 728px; }
  .v3 .feed { height: 650px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .v3 .card { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; margin: 0; padding: 6px 10px; align-items: center; gap: 10px; }
  .v3 .card .rank { width: 22px; color: var(--muted); font-size: 12px; text-align: right; flex: none; }
  .v3 .card h3 { font-size: 13px; margin: 1px 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v3 .card button { font-size: 11px; padding: 1px 6px; }
  .v3 .nav a { padding: 4px 8px; font-size: 13px; }
</style></head>
<body>
<div id="app"></div>
<!--COMMON-->
<script>
(function () {
  const OUTLETS = ['Ridgeline Courier', 'Harbor Lantern', 'Cobalt Dispatch', 'Tarn Ledger', 'Fennel Post', 'Vesper Wire',
    'Quill & Reed Review', 'Outpost Daily', 'Knoll Herald', 'Sable Bulletin', 'Prism Weekly', 'Driftwood Record'];
  const TOPICS = ['Weather', 'Science', 'Transit', 'Gardens', 'Markets', 'Libraries', 'Coastline', 'Rail', 'Festivals', 'Schools', 'Bridges', 'Orchards'];
  const SWATCH = ['#c9b79c', '#9fb7c9', '#a9c79b', '#c99fb5', '#9cc5c3', '#c7bf9a', '#ad9fc9', '#c9a89b'];
  const V = P.variant % 4;
  const r = P.rand;
  const ages = [];   // {el, born}
  let cards = 0;
  let host, feedEls, trendEls = [], chipEls = [];

  function E(tag, cls, text, attrs) {
    const e = P.el(tag, cls, text);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function tgt(e, id, alt) { e.dataset.targetId = id; e.dataset.alt = alt; return e; }
  function agoText(sec) {
    if (sec < 45) return 'just now';
    if (sec < 3600) return Math.max(1, Math.round(sec / 60)) + ' min ago';
    return Math.round(sec / 3600) + ' h ago';
  }
  function setAgo(a) { a.el.textContent = agoText((Date.now() - a.born) / 1000); }

  // one news item; ids: suffix for target ids on the buttons (initial cards only)
  function card(ids, fresh) {
    const c = E('article', 'card'); c.setAttribute('data-block', '');
    cards++;
    const bd = E('div', 'bd');
    const meta = E('div', 'meta');
    const ago = E('span', 'ago');
    const born = fresh ? Date.now() : Date.now() - Math.round(P.between(60, 7000)) * 1000;
    ages.push({ el: ago, born }); setAgo(ages[ages.length - 1]);
    meta.append(E('span', 'src', P.pick(OUTLETS)), E('span', null, '·'), E('span', null, P.pick(TOPICS)), E('span', null, '·'), ago);
    const h = E('h3', null, P.sentence(V === 3 ? 7 + Math.floor(r() * 4) : 5 + Math.floor(r() * 5))); h.dataset.vary = 'text';
    bd.append(meta, h);
    if (V !== 3 && (V !== 0 || r() < .7)) { const p = E('p', null, P.sentence(V === 1 ? 16 : 9 + Math.floor(r() * 7))); p.dataset.vary = 'text'; bd.append(p); }
    const acts = E('div', 'acts');
    const save = E('button', null, 'Save'), share = E('button', null, 'Share'), like = E('button', null, 'Like');
    const cnt = E('span', 'cnt', String(Math.floor(P.between(3, 400)))); cnt.dataset.vary = 'num';
    const follow = E('button', null, 'Follow'), more = E('button', 'more', 'Read more');
    acts.append(save, share, like, cnt, follow, more);
    bd.append(acts);
    if (ids) {
      tgt(save, 'save-' + ids, 'Saved'); tgt(share, 'share-' + ids, 'Shared'); tgt(like, 'like-' + ids, 'Liked');
      tgt(follow, 'follow-' + ids, 'Following'); tgt(more, 'more-' + ids, 'Read');
    }
    const col = P.pick(SWATCH);
    if (V === 0) { const t = E('div', 'thumb'); t.style.cssText = `width:118px;height:84px;background:${col}`; c.append(bd, t); }
    else if (V === 1) { const t = E('div', 'thumb'); t.style.cssText = `width:190px;height:118px;background:${col}`; c.append(t, bd); }
    else if (V === 2) { const t = E('div', 'thumb'); t.style.cssText = `width:100%;height:${Math.round(P.between(50, 120))}px;background:${col}`; c.append(t, bd); }
    else { const rk = E('span', 'rank', fresh ? '•' : String(cards)); c.append(rk, bd); acts.style.gap = '4px'; }
    return c;
  }

  function statusBar() {
    const s = E('div', 'status');
    const live = E('span', null, 'Live'); const clock = E('span', 'clk', 'updated 0.0 s ago');
    const bar = E('div', 'livebar'); const fill = E('b'); bar.append(fill);
    const pill = E('span', 'pill', '1 new story');
    s.append(E('span', 'dot'), live, bar, clock, E('span', 'grow'), pill);
    return { s, clock, fill, pill };
  }
  function ticker() {
    const t = E('div', 'ticker'); const lab = E('span', 'lab', 'LATEST'); const run = E('span', 'run');
    const items = []; for (let i = 0; i < 9; i++) items.push(P.pick(OUTLETS) + ': ' + P.sentence(6));
    run.textContent = items.join('   •   ') + '   •   ';
    run.textContent += run.textContent;
    t.append(lab, run); return { t, run };
  }
  function trendBox(n, title) {
    const b = E('div', 'box'); b.append(E('h4', null, title || 'Trending'));
    for (let i = 0; i < n; i++) {
      const row = E('div', 'trend'); const tx = E('span', 'tx'); const c = E('span', 'c');
      row.append(E('span', 'n', String(i + 1)), tx, c); b.append(row); trendEls.push({ tx, c });
    }
    return b;
  }
  let trendOff = 0;
  const trendWords = Array.from({ length: 14 }, () => '#' + P.words(1) + ' ' + P.pick(TOPICS).toLowerCase());
  const trendCounts = trendWords.map(() => Math.floor(P.between(2, 90)));
  function paintTrends() {
    trendEls.forEach((t, i) => { const k = (i + trendOff) % trendWords.length; t.tx.textContent = trendWords[k]; t.c.textContent = trendCounts[k] + 'k posts'; });
    chipEls.forEach((c, i) => { c.textContent = trendWords[(i + trendOff) % trendWords.length]; });
  }
  function subscribeBox(compact) {
    const b = E('div', 'box'); b.append(E('h4', null, 'Morning digest'));
    if (!compact) b.append(E('div', 'muted', 'Top stories in one note, every day at 7.'));
    const f = E('div', 'field', 'you@example.org'); f.style.marginTop = '8px';
    const btn = E('button', 'pri', 'Subscribe', { 'data-action-id': 'subscribe' }); btn.style.cssText = 'font-size:13px;padding:5px 14px;';
    b.append(f, btn); return b;
  }
  function composeBox(idx) {
    const b = E('div', 'box'); b.append(E('h4', null, 'Send a tip'));
    const f = E('div', 'field', 'What did you see?'); f.style.height = '48px';
    const row = E('div'); row.style.cssText = 'display:flex;gap:6px;';
    row.append(tgt(E('button', null, 'Attach'), 'attach', 'Attached'), E('span', 'grow'), tgt(E('button', 'pri', 'Send tip'), 'send-tip', 'Sent'));
    b.append(f, row); return b;
  }
  function sourcesBox(n) {
    const b = E('div', 'box'); b.append(E('h4', null, 'Outlets to follow'));
    for (let i = 0; i < n; i++) {
      const row = E('div', 'srcrow'); row.setAttribute('data-block', '');
      const sq = E('span', 'sq'); sq.style.background = P.pick(SWATCH);
      const nm = E('span', 'grow', P.pick(OUTLETS)); nm.dataset.vary = 'name';
      row.append(sq, nm, tgt(E('button', null, 'Follow'), 'src-follow-' + (i + 1), 'Following'));
      b.append(row);
    }
    return b;
  }
  function nav(items, prefix) {
    const n = E('div', 'nav');
    items.forEach((t, i) => { const a = E('a', i === 0 ? 'on' : null, t, { href: '#' }); if (i >= 1 && i <= 2) tgt(a, prefix + i, t + ' (new)'); n.append(a); });
    return n;
  }
  function topbar(extra) {
    const t = E('div', 'topbar');
    const brand = E('div', 'brand'); brand.innerHTML = 'The <i>Daily</i> Tarn';
    t.append(brand, E('div', 'search', 'Search stories'), ...extra);
    return t;
  }

  P.init = function () {
    host = document.getElementById('app');
    document.body.className = 'v' + V;
    let sb, tk, lists = [];
    const ITEMS = ['Top stories', 'Local', 'Science', 'Culture', 'Markets', 'Saved'];
    if (V === 0) {
      tk = ticker();
      host.append(topbar([E('span', 'grow'), tgt(E('a', null, 'Editions', { href: '#' }), 'editions', 'Editions (2)'), tgt(E('button', null, 'Sign in'), 'signin', 'Signed in')]), tk.t);
      const main = E('div', 'main'); host.append(main);
      const left = E('div'); left.append(nav(ITEMS, 'nav-'));
      const mid = E('div'); sb = statusBar(); const feed = E('div', 'feed'); mid.append(sb.s, feed); lists = [feed];
      for (let i = 1; i <= 7; i++) feed.append(card(i <= 3 ? String(i) : null));
      const right = E('div'); right.append(trendBox(5), subscribeBox(false), sourcesBox(2));
      main.append(left, mid, right);
    } else if (V === 1) {
      tk = ticker();
      const tabs = E('div', 'tabs'); ['For you', 'Latest', 'Following'].forEach((t, i) => { const a = E('a', i === 1 ? 'on' : null, t, { href: '#' }); if (i === 2) tgt(a, 'tab-following', 'Following (3)'); tabs.append(a); });
      host.append(topbar([tabs, E('span', 'grow'), tgt(E('button', null, 'Menu'), 'menu', 'Close')]));
      const main = E('div', 'main'); host.append(main);
      const left = E('div'); sb = statusBar(); const feed = E('div', 'feed'); left.append(sb.s, feed); lists = [feed];
      for (let i = 1; i <= 6; i++) feed.append(card(i <= 3 ? String(i) : null));
      const right = E('div'); right.append(composeBox(), subscribeBox(true), trendBox(5));
      const tkWrap = E('div'); tkWrap.style.cssText = 'border-radius:6px;overflow:hidden;'; tkWrap.append(tk.t); right.append(tkWrap);
      main.append(left, right);
    } else if (V === 2) {
      tk = ticker();
      host.append(topbar([E('span', 'grow'), tgt(E('a', null, 'Topics', { href: '#' }), 'topics', 'Topics (4)'), tgt(E('button', 'pri', 'Join'), 'join', 'Joined')]));
      const chips = E('div', 'chips'); chips.append(E('span', 'muted', 'Trending:'));
      for (let i = 0; i < 8; i++) { const c = E('span', 'chip'); chipEls.push(c); chips.append(c); }
      host.append(chips);
      const main = E('div', 'main'); host.append(main);
      const left = E('div'); sb = statusBar(); const cols = E('div', 'cols'); left.append(sb.s, cols);
      const c1 = E('div', 'feed'), c2 = E('div', 'feed'); cols.append(c1, c2); lists = [c1, c2];
      for (let i = 1; i <= 8; i++) (i % 2 ? c1 : c2).append(card(i <= 4 ? String(i) : null));
      const right = E('div'); right.append(subscribeBox(false), sourcesBox(3));
      const tkWrap = E('div'); tkWrap.style.cssText = 'border-radius:6px;overflow:hidden;'; tkWrap.append(tk.t); right.append(tkWrap);
      main.append(left, right);
    } else {
      tk = ticker();
      host.append(topbar([E('span', 'grow'), tgt(E('a', null, 'Archive', { href: '#' }), 'archive', 'Archive (9)'), tgt(E('a', null, 'Log in', { href: '#' }), 'login', 'Logged in')]));
      host.append(tk.t);
      const main = E('div', 'main'); host.append(main);
      const left = E('div'); left.append(nav(ITEMS.concat(['Rail', 'Orchards']), 'sec-'));
      const mid = E('div'); sb = statusBar(); const feed = E('div', 'feed'); mid.append(sb.s, feed); lists = [feed];
      for (let i = 1; i <= 16; i++) feed.append(card(i <= 3 ? String(i) : null));
      const right = E('div'); right.append(subscribeBox(true), trendBox(6), composeBox());
      main.append(left, mid, right);
    }
    paintTrends();
    P.action = { id: 'subscribe', smallLabel: 'Subscribed ✓', panelText: "You're subscribed." };
    P.hooks.blockOf = t => t.closest('[data-block]') || t;
    // A bare control cloned as its own block: drop the marker class so the clone matches the target's signature.
    P.hooks.lookalike = (t, b, c) => {
      if (b === t) { c.classList.remove('pf-lookalike'); if (!c.className) c.removeAttribute('class'); c.dataset.pfLookalike = '1'; }
      b.parentNode.insertBefore(c, b);
    };
    // Header controls sit in a flex row whose spacer absorbs any insert: push the whole header down with a notice instead.
    P.hooks.moveTarget = (t, h, rr) => {
      const bar = t.closest('.topbar');
      const b = bar || P.hooks.blockOf(t);
      const s = E('div', 'pf-inserted');
      s.style.cssText = `height:${h}px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:6px;` +
        'margin:0 0 8px 0;padding:8px 12px;font-size:13px;overflow:hidden;grid-column:1/-1;';
      s.textContent = P.pick(['Update available. ', 'Section expanded. ', 'New items below. ', 'Notice: '], rr) + P.sentence(10, rr);
      b.parentNode.insertBefore(s, b);
    };

    // ---- motion ----
    const lastUpd = Date.now();
    let upd = lastUpd, newCount = 0, x = 0, pillOff = null;
    const tickMs = P.level(120, 80, 40);
    const tickStep = P.level(1, 3, 5);
    if (tickMs) setInterval(() => {   // always-on: ticker crawl, live clock, progress bar
      const half = tk.run.offsetWidth / 2;
      x = (x + tickStep) % Math.max(1, half);
      tk.run.style.transform = `translateX(${(V === 1 || V === 2 ? 0 : 90) - x}px)`;
      const s = (Date.now() - upd) / 1000;
      sb.clock.textContent = 'updated ' + s.toFixed(1) + ' s ago';
      sb.fill.style.width = Math.min(90, Math.round(s * 30)) + 'px';
    }, tickMs);
    const every = P.level(6000, 3000, 1500);
    if (every) {
      let k = 0;
      const ins = () => {
        const list = lists[k++ % lists.length];
        list.insertBefore(card(null, true), list.firstChild);
        newCount++; upd = Date.now();
        sb.pill.textContent = newCount + (newCount === 1 ? ' new story' : ' new stories') + ' ↑';
        sb.pill.style.visibility = 'visible';
        if (pillOff) clearTimeout(pillOff);
        pillOff = setTimeout(() => { sb.pill.style.visibility = 'hidden'; }, 1400);
        setTimeout(ins, every * P.between(0.8, 1.2));
      };
      setTimeout(ins, Math.max(1300, every * P.between(0.7, 1.1)));
    }
    const agoMs = P.level(10000, 4000, 2000);
    if (agoMs) setInterval(() => ages.forEach(a => { if (a.el.isConnected) setAgo(a); }), agoMs);
    const trendMs = P.level(8000, 4000, 2000);
    if (trendMs) setInterval(() => {
      trendOff = (trendOff + 1) % trendWords.length;
      const i = Math.floor(r() * trendCounts.length); trendCounts[i] += 1 + Math.floor(r() * 3);
      paintTrends();
    }, trendMs);
    if (!tickMs) tk.run.style.transform = `translateX(${(V === 1 || V === 2 ? 0 : 90)}px)`;
  };
})();
</script>
</body></html>
