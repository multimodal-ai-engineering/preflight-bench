<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Feed</title>
<style>
  * { box-sizing: border-box; caret-color: transparent; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #f5f6f7;
    font: 14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1d2329; }
  header { height: 56px; background: #fff; border-bottom: 1px solid #e1e4e8; display: flex; align-items: center; padding: 0 24px; gap: 18px; }
  .logo { font-weight: 700; font-size: 18px; letter-spacing: .02em; }
  .search { flex: 0 0 360px; height: 34px; border: 1px solid #d6dade; border-radius: 17px; padding: 7px 14px; color: #7a838c; }
  .grow { flex: 1; }
  .layout { display: grid; grid-template-columns: 220px 640px 1fr; gap: 24px; padding: 18px 24px; height: 744px; }
  nav a { display: block; padding: 8px 10px; color: #1d2329; text-decoration: none; border-radius: 6px; }
  nav a.on { background: #e8ebee; font-weight: 600; }
  .btn { font: inherit; border: 1px solid #c9ced3; background: #fff; border-radius: 6px; padding: 5px 12px; color: #1d2329; }
  .btn.primary { background: #2f5d8a; border-color: #2f5d8a; color: #fff; }
  .icon { width: 24px; height: 24px; padding: 0; border: 0; background: transparent; font: 16px/24px Arial; color: #59636d; border-radius: 4px; }
  .feedcol { position: relative; overflow: hidden; }
  .composer { background: #fff; border: 1px solid #e1e4e8; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
  .composer .box { flex: 1; height: 36px; border: 1px solid #e1e4e8; border-radius: 8px; padding: 8px 10px; color: #7a838c; }
  .posts { position: relative; }
  .post { background: #fff; border: 1px solid #e1e4e8; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .post .top { display: flex; align-items: center; gap: 10px; }
  .av { width: 32px; height: 32px; border-radius: 50%; flex: none; }
  .name { font-weight: 600; }
  .when { color: #7a838c; font-size: 12px; }
  .post p { margin: 8px 0 10px; }
  .post .row { display: flex; gap: 10px; align-items: center; }
  .likes { color: #59636d; font-size: 13px; margin-left: auto; }
  .pill { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); background: #2f5d8a; color: #fff; border-radius: 14px;
    padding: 4px 14px; font-size: 13px; display: none; z-index: 5; }
  .side h3 { font-size: 14px; margin: 0 0 8px; }
  .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .who { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .who .grow { font-size: 13px; }
  .trend { padding: 5px 0; font-size: 13px; border-bottom: 1px solid #f0f1f2; }
  .trend span { color: #7a838c; float: right; }
</style></head>
<body>
<header>
  <div class="logo">Feed</div><div class="search">Search</div><div class="grow"></div>
  <button class="icon" data-target-id="bell" data-alt="●">🔔</button>
  <a href="#" data-target-id="link-help" data-alt="Help (new)" style="color:#2f5d8a;font-size:13px">Help</a>
  <div class="av" style="background:#c8b6a6"></div>
</header>
<div class="layout">
  <nav>
    <a href="#" class="on">Home</a><a href="#">Explore</a>
    <a href="#" data-target-id="nav-messages" data-alt="Messages (1)">Messages</a>
    <a href="#">Bookmarks</a><a href="#">Lists</a><a href="#">Profile</a>
    <div style="margin-top:14px"><button class="btn primary" data-target-id="compose" data-alt="Drafting">New post</button></div>
  </nav>
  <section class="feedcol">
    <div class="composer" data-block><div class="av" style="background:#9fb4c8"></div><div class="box">Share an update</div>
      <button class="btn primary" data-action-id="post">Post</button></div>
    <div class="pill" id="pill">New posts</div>
    <div class="posts" id="posts"></div>
  </section>
  <aside class="side">
    <div class="card"><h3>Who to follow</h3><div id="who"></div></div>
    <div class="card"><h3>Trending</h3><div id="trends"></div></div>
  </aside>
</div>
<!--COMMON-->
<script>
(function () {
  const COLORS = ['#c8b6a6', '#9fb4c8', '#b6c8a6', '#c8a6b9', '#a6c3c8', '#c8c0a6', '#b0a6c8'];
  const NAMES = ['R. Okafor', 'M. Lindqvist', 'J. Tanaka', 'A. Moreau', 'S. Haddad', 'L. Novak', 'D. Ferreira', 'K. Osei', 'P. Varga', 'T. Nakamura'];
  let likeEls = [];
  function post(ids) {
    const d = P.el('div', 'post'); d.setAttribute('data-block', '');
    const top = P.el('div', 'top');
    const av = P.el('div', 'av'); av.style.background = P.pick(COLORS);
    const nm = P.el('div'); const n = P.el('div', 'name', P.pick(NAMES)); n.dataset.vary = 'name';
    nm.append(n, P.el('div', 'when', Math.ceil(P.rand() * 50) + ' min'));
    const more = P.el('button', 'icon', '⋯'); more.style.marginLeft = 'auto';
    top.append(av, nm, more);
    const p = P.el('p', null, P.sentence(8 + Math.floor(P.rand() * 18))); p.dataset.vary = 'text';
    const row = P.el('div', 'row');
    const r = P.el('button', 'btn', 'Reply'), s = P.el('button', 'btn', 'Save');
    const lk = P.el('span', 'likes'); lk.dataset.n = String(Math.floor(P.rand() * 300)); lk.textContent = lk.dataset.n + ' likes'; lk.dataset.vary = 'num';
    likeEls.push(lk);
    row.append(r, s, lk);
    if (ids) {
      r.dataset.targetId = 'reply-' + ids; r.dataset.alt = 'Replied';
      s.dataset.targetId = 'save-' + ids; s.dataset.alt = 'Saved';
      more.dataset.targetId = 'more-' + ids; more.dataset.alt = '✕';
    }
    d.append(top, p, row);
    return d;
  }
  const posts = document.getElementById('posts');
  for (let i = 1; i <= 6; i++) posts.append(post(i <= 4 ? String(i) : null));
  const who = document.getElementById('who');
  for (let i = 1; i <= 3; i++) {
    const w = P.el('div', 'who'); w.setAttribute('data-block', '');
    const av = P.el('div', 'av'); av.style.background = P.pick(COLORS);
    const n = P.el('div', 'grow', P.pick(NAMES)); n.dataset.vary = 'name';
    const f = P.el('button', 'btn', 'Follow');
    if (i <= 2) { f.dataset.targetId = 'follow-' + i; f.dataset.alt = 'Following'; }
    w.append(av, n, f); who.append(w);
  }
  const trends = document.getElementById('trends');
  for (let i = 0; i < 6; i++) {
    const t = P.el('div', 'trend', '#' + P.words(1)); const c = P.el('span', null, Math.floor(P.rand() * 90 + 5) + 'k'); t.append(c); trends.append(t);
  }
  P.action = { id: 'post', smallLabel: 'Posted ✓', panelText: 'Your post is live.' };

  P.init = function () {
    const every = P.level(4000, 2500, 1500);
    if (every) {
      const ins = () => {
        posts.insertBefore(post(null), posts.firstChild);
        const pill = document.getElementById('pill'); pill.style.display = 'block';
        setTimeout(() => { pill.style.display = 'none'; }, 900);
        setTimeout(ins, every * P.between(0.8, 1.2));
      };
      setTimeout(ins, every * P.between(0.3, 1.0));
    }
    const tick = P.level(900, 500, 250);
    if (tick) setInterval(() => {
      const lk = P.pick(likeEls); if (!lk.isConnected) return;
      lk.dataset.n = String(+lk.dataset.n + 1 + Math.floor(P.rand() * 3)); lk.textContent = lk.dataset.n + ' likes';
    }, tick);
  };
})();
</script>
</body></html>
