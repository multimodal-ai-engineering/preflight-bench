[project]
name = "preflight-bench"
version = "0.1.0"
description = "Benchmark and checks for stale clicks in computer-use agents (independent research)"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "playwright",
  "opencv-python-headless",
  "numpy",
  "scikit-image",
  "pillow",
  "pandas",
  "scipy",
  "matplotlib",
  "anthropic",
  "mlx-vlm>=0.7.10",
  "tabulate>=0.10.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anchored", "src/bench", "src/generator", "src/harness", "src/live", "src/models", "src/realsite"]
